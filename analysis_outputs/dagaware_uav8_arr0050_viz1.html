<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DAG-Aware Teacher Results (2026-05-10)</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 18px; color: #111; }
    h1 { margin: 0 0 8px 0; font-size: 22px; }
    p { margin: 0 0 16px 0; color: #444; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(320px, 1fr)); gap: 16px; }
    .chart { border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
  </style>
</head>
<body>
  <h1>DAG-Aware Teacher | uav8 arr0.05 (Full vs Fallback)</h1>

  <div class="grid">
    <div id="chart_0" class="chart"></div><div id="chart_1" class="chart"></div><div id="chart_2" class="chart"></div><div id="chart_3" class="chart"></div><div id="chart_4" class="chart"></div><div id="chart_5" class="chart"></div><div id="chart_6" class="chart"></div>
  </div>
  <script>
    const plotData = {"runs":[{"label":"full_s42","file":"log_data_dagaware_uav8_arr0050_full_seed42_2026-05-10.json","reward":-7.946148893192836,"dag_success_rate":0.28918560595893295,"dag_task_finish_rate":0.6381468438710974,"dag_task_drop_rate":0.28791589486330343,"avg_stage_b_assigned_coverage":0.43810078124999996,"avg_stage_b_progress_reward":0.9471532891099117,"avg_stage_b_dag_shaping_reward":-0.0002256624523469326,"episodes":100},{"label":"full_s43","file":"log_data_dagaware_uav8_arr0050_full_seed43_2026-05-10.json","reward":329.9262377752057,"dag_success_rate":0.22422677040519698,"dag_task_finish_rate":0.6107151093064516,"dag_task_drop_rate":0.31074779212113673,"avg_stage_b_assigned_coverage":0.46241171875,"avg_stage_b_progress_reward":0.9466706461501418,"avg_stage_b_dag_shaping_reward":-0.0006026350810053439,"episodes":100},{"label":"full_s44","file":"log_data_dagaware_uav8_arr0050_full_seed44_2026-05-10.json","reward":364.96789781387656,"dag_success_rate":0.14830196701367276,"dag_task_finish_rate":0.5248559813151712,"dag_task_drop_rate":0.38463679654207,"avg_stage_b_assigned_coverage":0.5407906249999999,"avg_stage_b_progress_reward":0.9481451992420034,"avg_stage_b_dag_shaping_reward":-0.0010312645910641133,"episodes":100},{"label":"fallback_s42","file":"log_data_dagaware_uav8_arr0050_fallback_seed42_2026-05-10.json","reward":451.1781263567045,"dag_success_rate":0.27417828752492335,"dag_task_finish_rate":0.6471616299465701,"dag_task_drop_rate":0.2773238310596696,"avg_stage_b_assigned_coverage":0.4385968750000003,"avg_stage_b_progress_reward":0.9551845655316038,"avg_stage_b_dag_shaping_reward":-0.0003018805796191624,"episodes":100},{"label":"fallback_s43","file":"log_data_dagaware_uav8_arr0050_fallback_seed43_2026-05-10.json","reward":318.96849299591366,"dag_success_rate":0.22609208849074613,"dag_task_finish_rate":0.6113613788333412,"dag_task_drop_rate":0.30972862833406223,"avg_stage_b_assigned_coverage":0.45935234375,"avg_stage_b_progress_reward":0.9473243443112916,"avg_stage_b_dag_shaping_reward":-0.0005896670809105331,"episodes":100},{"label":"fallback_s44","file":"log_data_dagaware_uav8_arr0050_fallback_seed44_2026-05-10.json","reward":324.7269932033754,"dag_success_rate":0.14998026309922657,"dag_task_finish_rate":0.5247548007121506,"dag_task_drop_rate":0.3851010820991745,"avg_stage_b_assigned_coverage":0.5394789062500002,"avg_stage_b_progress_reward":0.9486275226352895,"avg_stage_b_dag_shaping_reward":-0.001019112521678625,"episodes":100}],"agg":[{"label":"full_mean","reward":228.98266223196313,"dag_success_rate":0.22057144779260093,"dag_task_finish_rate":0.5912393114975735,"dag_task_drop_rate":0.3277668278421701,"avg_stage_b_assigned_coverage":0.4804343749999999,"avg_stage_b_progress_reward":0.9473230448340191,"avg_stage_b_dag_shaping_reward":-0.00061985404147213,"episodes":300},{"label":"fallback_mean","reward":364.9578708519978,"dag_success_rate":0.2167502130382987,"dag_task_finish_rate":0.594425936497354,"dag_task_drop_rate":0.3240511804976354,"avg_stage_b_assigned_coverage":0.47914270833333344,"avg_stage_b_progress_reward":0.9503788108260616,"avg_stage_b_dag_shaping_reward":-0.0006368867274027735,"episodes":300}]};
    const colors = {
      full: '#1f77b4',
      fallback: '#ff7f0e',
      full_mean: '#2ca02c',
      fallback_mean: '#d62728'
    };

    function labelCategory(label) {
      if (label.startsWith('full')) return 'full';
      if (label.startsWith('fallback')) return 'fallback';
      return 'other';
    }

    function makeBar(metricKey, title, divId) {
      const labels = plotData.runs.map(r => r.label);
      const values = plotData.runs.map(r => r[metricKey]);
      const barColors = plotData.runs.map(r => colors[labelCategory(r.label)] || '#888');

      const aggLabels = plotData.agg.map(a => a.label);
      const aggValues = plotData.agg.map(a => a[metricKey]);
      const aggColors = plotData.agg.map(a => colors[a.label] || '#555');

      const traces = [
        { type: 'bar', x: labels, y: values, marker: {color: barColors}, name: 'per-seed', showlegend: false },
        { type: 'bar', x: aggLabels, y: aggValues, marker: {color: aggColors}, name: 'mean', showlegend: false }
      ];

      Plotly.newPlot(divId, traces, {
        title,
        margin: {t: 40, r: 10, b: 80, l: 50},
        xaxis: {tickangle: -30},
        yaxis: {automargin: true},
        barmode: 'group'
      }, {displayModeBar: false});
    }

    function makeSummary() {
      const rows = plotData.runs.map(r => ({
        label: r.label,
        episodes: r.episodes,
        reward: r.reward,
        dag_success_rate: r.dag_success_rate,
        dag_task_finish_rate: r.dag_task_finish_rate,
        dag_task_drop_rate: r.dag_task_drop_rate
      }));
      const header = ['run', 'episodes', 'reward', 'dag_success_rate', 'finish_rate', 'drop_rate'];
      const table = [
        {type: 'table',
         header: {values: header, align: 'left', fill: {color: '#f3f3f3'}},
         cells: {
           values: [
             rows.map(r => r.label),
             rows.map(r => r.episodes),
             rows.map(r => r.reward.toFixed(3)),
             rows.map(r => r.dag_success_rate.toFixed(3)),
             rows.map(r => r.dag_task_finish_rate.toFixed(3)),
             rows.map(r => r.dag_task_drop_rate.toFixed(3))
           ],
           align: 'left'
         }
        }
      ];
      Plotly.newPlot('summary', table, {margin: {t: 20, r: 10, b: 10, l: 10}}, {displayModeBar: false});
    }

    makeSummary();
    makeBar('reward', 'Reward (avg per episode)', 'chart_0');
    makeBar('dag_success_rate', 'DAG Success Rate', 'chart_1');
    makeBar('dag_task_finish_rate', 'DAG Task Finish Rate', 'chart_2');
    makeBar('dag_task_drop_rate', 'DAG Task Drop Rate', 'chart_3');
    makeBar('avg_stage_b_assigned_coverage', 'Stage B Assigned Coverage', 'chart_4');
    makeBar('avg_stage_b_progress_reward', 'Stage B Progress Reward', 'chart_5');
    makeBar('avg_stage_b_dag_shaping_reward', 'Stage B DAG Shaping Reward', 'chart_6');
  </script>
</body>
</html>
