min_task_constant = 166_666.7
# 复杂度函数的 CPU cycles 系数上限。（暂定）
max_task_constant = 500_000
# 复杂度 n 的抽样概率，无量纲。（暂定）
linear_probability = 0.2
# 复杂度 n × log2(n) 的抽样概率，无量纲。（暂定）
log_probability = 0.7
# 复杂度 n × log2(n)² 的抽样概率，无量纲。（暂定）
squared_log_probability = 0.1
