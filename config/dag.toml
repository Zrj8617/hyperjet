[dag]
# 每 DAG 最少节点数，单位：个。（暂定）
min_tasks = 5
# 每 DAG 最多节点数，单位：个。（暂定）
max_tasks = 8
# 每 DAG 最大层数，单位：层。（暂定）
max_levels = 4
# 每节点最大父节点数，单位：个。（暂定）
